# 模型供应商配置示例：复制为 config/providers.yaml 后填写
# 设计原则：BYOK，不锁定任何一家；API Key 只从环境变量读取，绝不写进文件

default_provider: nano-banana

providers:
  nano-banana:
    type: gemini_image
    label: Nano Banana (Gemini Image)
    model: gemini-2.5-flash-image
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GEMINI_API_KEY
    supports:
      edit: true          # 支持图生图（商品保真编辑）
      generate: true
    max_input_side_px: 2048

  gpt-image-2:
    type: openai_image
    label: GPT Image 2
    model: gpt-image-2
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    supports:
      edit: true
      generate: true

  qwen-image-edit:
    type: openai_image
    label: Qwen Image Edit (DashScope 兼容模式)
    model: qwen-image-edit
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    supports:
      edit: true
      generate: false

  seedream:
    type: openai_image
    label: Seedream (火山方舟兼容模式)
    model: seedream-4-0
    base_url: https://ark.cn-beijing.volces.com/api/v3
    api_key_env: ARK_API_KEY
    supports:
      edit: true
      generate: true

  mock:
    type: mock
    label: 本地占位模型（无需 Key，用于跑通流程与测试）
    supports:
      edit: true
      generate: true
